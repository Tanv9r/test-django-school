<form method="get" class="card-hms filter-bar" role="search">
  {% if scope %}<input type="hidden" name="scope" value="{{ scope }}">{% endif %}
  <div class="row g-2 align-items-end">
    {% for field in filter_form %}
      <div class="col-12 {% if forloop.first %}col-md-6 col-xl{% else %}col-sm-6 col-md-3 col-xl-2{% endif %}">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
      </div>
    {% endfor %}
    <div class="col-12 col-xl-auto d-flex gap-2">
      <button type="submit" class="btn btn-primary flex-fill"><i class="bi bi-funnel"></i> Apply</button>
      <a href="{{ request.path }}" class="btn btn-light flex-fill">Reset</a>
    </div>
  </div>
  {% if filter_form.non_field_errors %}<div class="text-danger small mt-2">{{ filter_form.non_field_errors|join:" " }}</div>{% endif %}
</form>
