<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-body p-4 text-center">
        <div class="empty-icon tone-warning mx-auto mb-3" style="width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:1.6rem;">
          <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h5 class="modal-title mb-2" id="confirmModalTitle">Are you sure?</h5>
        <p class="text-muted mb-4" data-confirm-message></p>
        <div class="d-flex justify-content-center gap-2">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Go back</button>
          <button type="button" class="btn btn-danger" data-confirm-accept>Confirm</button>
        </div>
      </div>
    </div>
  </div>
</div>
