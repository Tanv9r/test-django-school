<div class="empty-state">
  <div class="empty-icon"><i class="bi bi-{{ icon|default:'inbox' }}"></i></div>
  <h3>{{ title|default:"Nothing here yet" }}</h3>
  <p>{{ message|default:"There are no records to display." }}</p>
  {% if action_url %}<a href="{{ action_url }}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> {{ action_label|default:"Add new" }}</a>{% endif %}
</div>
