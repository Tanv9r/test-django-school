{% extends "base.html" %}
{% block body_class %}theme-staff{% endblock %}
{% block body %}
<div class="error-page">
  <div style="max-width:520px;">
    <div class="error-code mb-2">{% block code %}{% endblock %}</div>
    <h1 class="h3 fw-bold mb-2">{% block heading %}{% endblock %}</h1>
    <p class="text-muted mb-4">{% block message %}{% endblock %}</p>
    <div class="d-flex gap-2 justify-content-center flex-wrap">
      <a href="/" class="btn btn-primary"><i class="bi bi-house-door"></i> Back to dashboard</a>
      <a href="javascript:history.back()" class="btn btn-light"><i class="bi bi-arrow-left"></i> Go back</a>
    </div>
  </div>
</div>
{% endblock %}
